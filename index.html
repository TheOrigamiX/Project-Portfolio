root.style.setProperty("--ws",ws+"px");root.style.setProperty("--d",dd+"px");
XS=[0];for(let u=0,a=0;u<3*U;u+=2){a+=2/(1+Math.pow(u/U,1.6));XS.push(a)}}
const scl=u=>1/(1+Math.pow(Math.abs(u)/U,1.6));
const xsc=u=>{const a=Math.abs(u)/2,i=Math.min(XS.length-2,Math.floor(a));return sg(u)*(XS[i]+(XS[i+1]-XS[i])*(a-i))};
const B=r=>Math.abs(r)<1?(r+Math.sin(Math.PI*r)/Math.PI)/2:sg(r)*.5;
const F=r=>r*(ws+gap)+(dd-ws+1.4*gap)*B(r);
const rel=v=>((v-s+M/2)%M+M)%M-M/2;
const vAct=()=>((Math.round(s)%M)+M)%M;
function render(dt){
const sh=$("#shelf").getBoundingClientRect(),cy=sh.top+sh.height/2,W=innerWidth;
onC=Math.abs(mx-W/2)<.55*dd&&Math.abs(my-cy)<.55*H&&Math.abs(tg-s)<.3&&!open;
const ty2=onC?(mx-W/2)/(.55*dd)*8:(mx-W/2)/W*4,tx2=onC?-(my-cy)/(H/2)*5:0,ke=1-Math.exp(-7*dt);
ty+=(ty2-ty)*ke;tx+=(tx2-tx)*ke;
for(let v=0;v<M;v++){const el=tapes[v],r=rel(v),o=sm(Math.max(0,1-Math.abs(r))),u=F(r);
if(Math.abs(u)>U*1.95){el.style.display="none";continue}el.style.display="";
lift[v]+=((v===hov&&Math.abs(r)>.5?1:0)-lift[v])*(RM?1:1-Math.exp(-12*dt));
const sc=scl(u),k=1/sc,z=P*(1-k)+o*H*.1,x=xsc(u)*k,y=(H*.5*(1-sc)*.42+o*H*.012-lift[v]*H*.05)*k;
const ry=sg(u)*Math.min(1,Math.abs(u)/U)*26*(1-o)-90*o+ty*o;
el.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateX(${tx*o}deg) rotateY(${ry}deg)`;el.style.zIndex=Math.round(3000+z);
el.children[0].style.setProperty("--shade",Math.min(.6,o*.55+(1-sc)*.32));
el.children[1].style.setProperty("--shade",(1-o)*.82)}
const ps=open?0:sm(Math.max(0,1-Math.abs(tg-s)*3));
$("#ply").style.transform=`translate(${W/2-dd/2-6}px,${cy+.36*H}px) scale(${ps})`;
cfs.forEach(c=>{const d=+c.dataset.d;c.style.transform=`translate(${(mx-W/2)*d*.03}px,${(my-innerHeight/2)*d*.03}px)`})}
function sw(el,html,dir,first){const n=document.createElement("span");n.innerHTML=html;el.append(n);
if(first||RM){[...el.children].slice(0,-1).forEach(o=>o.remove());return}
[...el.children].forEach(o=>{if(o===n)o.animate([{transform:`translateY(${dir*105}%)`},{transform:"none"}],{duration:650,easing:E,fill:"both"});
else{const a=o.animate([{transform:getComputedStyle(o).transform},{transform:`translateY(${-dir*105}%)`}],{duration:650,easing:E,fill:"both"});a.onfinish=()=>o.remove()}})}
function setCap(i,dir,first){const d=D[i];sw($("#c1"),d.t,dir,first);sw($("#c2"),d.e+" / "+d.j,dir,first);sw($("#c3"),d.y+" — "+d.g,dir,first)}
const cur=$("#cur");
function loop(t){const dt=Math.min(.05,(t-last)/1e3);last=t;const intro=t<introEnd;
s+=(tg-s)*(RM?1:1-Math.exp(-(drag?18:intro?2.2:5.2)*dt));if(Math.abs(tg-s)<.0005)s=tg;
const a=((Math.round(s)%N)+N)%N;if(a!==act&&!intro){setCap(a,act<0?1:sg(tg-s)||1,false);act=a}
const target=(act<0?0:act)/(N-1)*100;dotx+=(target-dotx)*(RM?1:1-Math.exp(-14*dt));$("#dot").style.left=dotx+"%";
render(dt);
const k=1-Math.exp(-16*dt);cx+=(mx-cx)*k;cyy+=(my-cyy)*k;cur.style.transform=`translate3d(${cx}px,${cyy}px,0)`;
const bt=pt.closest&&pt.closest("button,a,.tl,.ar");
cur.className="cur"+(bt?" btn":onC?" open":(!open&&pt.closest&&pt.closest(".tape"))?" spine":"");
requestAnimationFrame(loop)}
const go=i=>{const c=((Math.round(tg)%N)+N)%N;tg=Math.round(tg)+((i-c+N/2)%N+N)%N-N/2};
const step=n=>{tg=Math.round(tg)+n};
$("#pv").onclick=()=>step(-1);$("#nx").onclick=()=>step(1);
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
$("#home").onclick=e=>{e.preventDefault();go(0)};
tl.onclick=e=>{const r=tl.getBoundingClientRect();go(Math.round(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*(N-1)))};
const shelf=$("#shelf");let dn=null,x0=0,t0=0,moved=false;
shelf.addEventListener("pointerdown",e=>{if(open)return;dn=e.target.closest(".tape");x0=e.clientX;t0=tg;moved=false;drag=true;shelf.setPointerCapture(e.pointerId)});
shelf.addEventListener("pointermove",e=>{if(drag){const dx=e.clientX-x0;if(Math.abs(dx)>5)moved=true;if(moved)tg=t0-dx/(ws+gap)}
else{const t=e.target.closest(".tape");hov=t?tapes.indexOf(t):-1}});
shelf.addEventListener("pointerleave",()=>{if(!drag)hov=-1});
addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY;pt=e.target});
shelf.addEventListener("pointerup",()=>{if(!drag)return;drag=false;if(moved){tg=Math.round(tg);return}
if(dn){const v=tapes.indexOf(dn),r=rel(v);if(Math.abs(r)<.5)openD();else tg=Math.round(tg+r)}});
shelf.addEventListener("pointercancel",()=>{drag=false;tg=Math.round(tg)});
let wt;shelf.addEventListener("wheel",e=>{if(open)return;e.preventDefault();const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;tg+=d/(ws+gap)*.5;clearTimeout(wt);wt=setTimeout(()=>tg=Math.round(tg),160)},{passive:false});
addEventListener("keydown",e=>{if(e.key==="Escape"&&open)closeD();else if(open)return;
else if(e.key==="ArrowLeft")step(-1);else if(e.key==="ArrowRight")step(1);else if(e.key==="Enter")openD()});
const dt=$("#dt"),lc=$("#lc"),pst=$("#pst");let cir=[];
const GS=[3.6,3.72,3.85,3.9,3.8],SUB=["คณิตศาสตร์","ฟิสิกส์","เคมี","อังกฤษ","ภาษาไทย"],GR=[[4,3.5,4,4,4],[3.5,4,4,4,3.5],[4,4,3.5,4,4],[3.5,3.5,4,3.5,4],[4,4,4,4,3.5]];
function fill(i){const d=D[i],ln=h=>`<div class="ln2"><div>${h}</div></div>`;let x="";
if(d.k==1){const pts=GS.map((g,n)=>`${10+n*70},${54-(g-3.5)/.5*44}`).join(" ");
x=ln(`<div style="display:flex;align-items:center;gap:18px"><span class="big">${(GS.reduce((a,b)=>a+b)/5).toFixed(2)}</span><span class="d2">GPAX<br>ตัวอย่าง</span><svg width="300" height="64" viewBox="0 0 300 64" style="margin-left:auto"><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2"/>${pts.split(" ").map(p=>`<circle cx="${p.split(",")[0]}" cy="${p.split(",")[1]}" r="4" fill="var(--ac)"/>`).join("")}</svg></div>`)+
ln(`<table><thead><tr><th>วิชา</th>${[1,2,3,4,5].map(n=>`<th>เทอม ${n}</th>`).join("")}</tr></thead><tbody>${SUB.map((s,r)=>`<tr><td>${s}</td>${GR[r].map(g=>`<td${g==4?' class="hi"':""}>${g}</td>`).join("")}</tr>`).join("")}</tbody><tfoot><tr><td>GPA</td>${GS.map(g=>`<td>${g.toFixed(2)}</td>`).join("")}</tr></tfoot></table>`)}
if(d.k==2)x=ln(`<div class="spc"><div><small>ปีกกว้าง</small><b>60 ซม.</b></div><div><small>น้ำหนัก</small><b>18 กรัม</b></div><div><small>เวลาบินนานสุด</small><b>42 วินาที</b></div><div><small>วัสดุ</small><b>บัลซา + ฟิล์ม</b></div></div>`);
lc.innerHTML=ln(`<span class="lbl" style="color:var(--ac)">${d.e} / ${d.j}</span>`)+ln(`<h2 class="d1">${d.t}</h2>`)+ln(`<span class="d2">${d.y} / ${d.g}</span>`)+ln(`<p class="d3">${d.m}</p>`)+x+ln(`<span class="d4">Written and directed by Nanthapop Nupradub${d.k==2?" · ค่าสเปกเป็นตัวอย่าง":""}</span>`);
const C=[[150,330,0],[340,600,120],[250,120,220],[90,760,300],[400,250,360],[260,860,420],[230,470,180]];
pst.innerHTML=`<div class="in ${pal(i)}" style="border-radius:0">${cover(i)}</div><svg viewBox="0 0 474 900" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><defs><filter id="ik" filterUnits="userSpaceOnUse" x="-300" y="-300" width="1100" height="1500"><feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="120" xChannelSelector="R" yChannelSelector="G"/></filter><mask id="mk" maskUnits="userSpaceOnUse" x="0" y="0" width="474" height="900"><rect width="474" height="900" fill="#fff"/><g filter="url(#ik)" fill="#000">${C.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="0"/>`).join("")}</g></mask></defs><rect width="474" height="900" style="fill:var(--sheet)" mask="url(#mk)"/></svg>`;
cir=[...pst.querySelectorAll("circle")].map((c,n)=>({c,dl:C[n][2]}))}
function ink(t0){const t=performance.now()-t0;let go=false;cir.forEach(o=>{const p=Math.min(1,Math.max(0,(t-520-o.dl)/1250));o.c.setAttribute("r",720*(1-Math.pow(1-p,3)));if(p<1)go=true});if(go&&open)requestAnimationFrame(()=>ink(t0))}
function rect(){const r=tapes[vAct()].children[1].getBoundingClientRect();return`inset(${r.top}px ${innerWidth-r.right}px ${innerHeight-r.bottom}px ${r.left}px round 3px)`}
function openD(){if(open)return;open=true;s=tg=Math.round(tg);render(0);const i=((Math.round(s)%N)+N)%N;fill(i);
const from=rect();dt.style.display="grid";
dt.animate([{clipPath:from},{clipPath:"inset(0 round 0)"}],{duration:RM?1:1050,easing:"cubic-bezier(.76,0,.18,1)",fill:"both"});
dt.querySelectorAll(".ln2>*").forEach((n,k)=>n.animate([{transform:"translateY(110%)"},{transform:"none"}],{duration:RM?1:900,delay:RM?0:620+k*75,easing:E,fill:"both"}));
if(RM)cir.forEach(o=>o.c.setAttribute("r",720));else ink(performance.now());dt.scrollTop=0}
function closeD(){if(!open)return;open=false;dt.getAnimations().forEach(a=>a.cancel());
const a=dt.animate([{clipPath:"inset(0 round 0)"},{clipPath:rect()}],{duration:RM?1:850,easing:"cubic-bezier(.76,0,.18,1)",fill:"both"});
a.onfinish=()=>{dt.style.display="none";dt.getAnimations().forEach(x=>x.cancel())}}
$("#cl").onclick=closeD;
measure();addEventListener("resize",measure);
requestAnimationFrame(loop);
</script>
